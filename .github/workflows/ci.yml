name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...

  cross-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archive
        run: |
          set -euo pipefail
          name="smtp-store_${{ matrix.goos }}_${{ matrix.goarch }}"
          outdir="dist/${name}"
          mkdir -p "${outdir}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -trimpath -o "${outdir}/smtp-store" ./cmd/smtp-store
          cp config.example.yaml "${outdir}/config.yaml"
          tar -C "${outdir}" -czf "dist/${name}.tar.gz" smtp-store config.yaml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smtp-store-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/smtp-store_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in "darwin/amd64" "darwin/arm64" "linux/amd64" "linux/arm64"; do
            os="${target%/*}"
            arch="${target#*/}"
            name="smtp-store_${os}_${arch}"
            outdir="dist/${name}"
            mkdir -p "${outdir}"
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -o "${outdir}/smtp-store" ./cmd/smtp-store
            cp config.example.yaml "${outdir}/config.yaml"
            tar -C "${outdir}" -czf "dist/${name}.tar.gz" smtp-store config.yaml
          done
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
