listen_addr: 127.0.0.1:2525
storage_root: ./data
hostname: localhost
verbose_logs: false

web:
  listen_addr: 0.0.0.0:8080
  session_ttl: 168h
  session_secret: change-this-long-random-secret

tls:
  enabled: false
  cert_file: ./certs/server.crt
  key_file: ./certs/server.key

users:
  - username: camera
    password: change-me

ui_users:
  - username: admin
    password: change-me-ui
